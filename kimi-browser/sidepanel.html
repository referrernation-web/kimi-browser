<!doctype html>
<html lang="tl">
  <head>
    <meta charset="utf-8" />
    <title>Kimi K3</title>
    <style>
      /* Tahasang binabaybay ang bawat kulay sa dalawang tema. Ang `transparent` sa
         <select> ang dahilan kung bakit puti-sa-puti ang mga opsyon sa dark mode. */
      :root {
        color-scheme: light dark;
        --bg: #fff;        --fg: #1a1a1a;    --dim: #5f6570;
        --panel: #f4f5f7;  --line: #d8dbe0;  --field: #fff;
        --accent: #7c5cff; --userbg: #ede8ff;
        --warn: #b46a00;   --warnbg: #fff4e0; --warnline: #f0c27a;
        --ask: #0b7a5a;    --askbg: #e2f6ef;  --askline: #8fd6bf;
        --err: #c0392b;    --errbg: #fdeceb;
      }
      /* Ang dark mode ay MANUAL na pinipili (☾ button) — hindi na sumusunod sa
         system theme. Puti ang default, gusto ng user. */
      body[data-theme='dark'] {
        --bg: #1b1d21;     --fg: #eceef1;    --dim: #a3abb8;
        --panel: #24272c;  --line: #3a3f47;  --field: #2b2f35;
        --accent: #9b85ff; --userbg: #322b52;
        --warn: #f0b657;   --warnbg: #3a2f1c; --warnline: #6b5528;
        --ask: #63d6ae;    --askbg: #1d3830;  --askline: #2f6353;
        --err: #ff8b7d;    --errbg: #3a2320;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg);
        font: 13px/1.55 ui-sans-serif, system-ui, sans-serif;
      }
      header {
        padding: 9px 9px 7px; border-bottom: 1px solid var(--line);
        background: var(--panel); display: grid; gap: 7px;
      }
      .row { display: flex; gap: 6px; align-items: center; }
      input, select, button, textarea {
        font: inherit; padding: 6px 8px; border: 1px solid var(--line);
        border-radius: 7px; background: var(--field); color: var(--fg);
        transition: border-color .15s, background .15s;
      }
      /* Kailangan ito ng Windows: hindi minamana ng <option> ang kulay ng <select>. */
      option { background: var(--field); color: var(--fg); }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      input { flex: 1; min-width: 0; }
      button { cursor: pointer; font-weight: 500; }
      button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--field)); }
      button:active { transform: translateY(1px); }
      .dim { color: var(--dim); font-size: 11px; line-height: 1.35; }
      .logo { width: 22px; height: 22px; border-radius: 6px; flex: none; }

      /* --- VIOLET STATUS LIGHT: parang orange ni Claude — kita kahit sari-sarili ang tab mo --- */
      #statuslight {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: var(--accent); box-shadow: 0 0 7px var(--accent);
        display: none; animation: pulse 1s infinite;
      }
      #statuslight.on { display: block; }

      /* --- SESSION TABS: pahalang, nai-drag para mag-reorder --- */
      #tabs {
        display: flex; align-items: flex-end; gap: 5px;
        padding: 6px 9px 0; background: var(--panel);
      }
      #tabstrip {
        display: flex; gap: 5px; overflow-x: auto; flex: 1;
        scrollbar-width: thin; padding-bottom: 0;
      }
      #tabstrip::-webkit-scrollbar { height: 4px; }
      .tab {
        display: flex; align-items: center; gap: 5px; flex: none;
        padding: 4px 6px 4px 10px; max-width: 150px;
        border: 1px solid var(--line); border-bottom: none;
        border-radius: 9px 9px 0 0; background: var(--bg);
        font-size: 11.5px; cursor: pointer; opacity: .75; user-select: none;
      }
      .tab.active {
        opacity: 1; font-weight: 600; border-color: var(--accent);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab .dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
        animation: pulse 1.2s infinite; flex: none;
      }
      @keyframes pulse { 50% { opacity: .25; } }
      .tab .unread {
        width: 7px; height: 7px; border-radius: 50%; background: var(--ask); flex: none;
      }
      .tab.dragging { opacity: .35; }
      .tab.dragover { border-left: 3px solid var(--accent); }
      .tab button {
        padding: 0 4px; border: none; background: none; color: var(--dim);
        font-size: 12px; line-height: 1;
      }
      .tab button:hover { color: var(--err); background: none; }
      #tabs > button { flex: none; padding: 4px 7px; margin-bottom: 2px; }

      #log { flex: 1; overflow-y: auto; padding: 11px; display: flex; flex-direction: column; gap: 9px; }
      #log > * { animation: rise .18s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

      .msg { padding: 8px 10px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .user { background: var(--userbg); align-self: flex-end; max-width: 88%; }
      .assistant { background: var(--panel); border: 1px solid var(--line); }
      .assistant.live { border-color: var(--accent); }
      .assistant.live::after { content: ' ▍'; color: var(--accent); animation: pulse .8s infinite; }
      .tool {
        color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px;
        padding: 2px 10px; border-left: 2px solid var(--line);
      }
      .error { color: var(--err); background: var(--errbg); border: 1px solid var(--err); }

      .confirm { border: 1px solid var(--warnline); background: var(--warnbg); padding: 10px; border-radius: 9px; }
      .confirm b { display: block; margin-bottom: 5px; color: var(--warn); }
      .question { border: 1px solid var(--askline); background: var(--askbg); padding: 10px; border-radius: 9px; }
      .question b { display: block; margin-bottom: 7px; color: var(--ask); }
      .opts { display: flex; flex-wrap: wrap; gap: 6px; }

      .tablebox { border: 1px solid var(--line); border-radius: 9px; padding: 9px; background: var(--panel); }
      .tablebox > .row { margin-bottom: 7px; }
      .tablewrap { overflow-x: auto; }
      table { border-collapse: collapse; font-size: 11.5px; width: 100%; }
      th, td { border-bottom: 1px solid var(--line); padding: 4px 7px; text-align: left; white-space: nowrap; }
      th { cursor: pointer; user-select: none; color: var(--dim); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
      th:hover { color: var(--accent); }
      tr:last-child td { border-bottom: none; }
      td a { color: var(--accent); }

      details.think { color: var(--dim); font-size: 12px; border-left: 2px dashed var(--line); padding: 2px 10px; }
      details.think summary { cursor: pointer; user-select: none; }
      details.think.live { border-left-color: var(--accent); }

      footer { padding: 9px; border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 6px; }
      footer .row { align-items: stretch; }
      #ask { flex: 1; resize: none; height: 56px; }
      #thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
      #thumbs:empty { display: none; }
      .thumb { position: relative; }
      .thumb img { height: 52px; border-radius: 6px; border: 1px solid var(--line); display: block; }
      .thumb button {
        position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
        padding: 0; border-radius: 50%; line-height: 1; font-size: 13px;
      }
      .msg img { max-width: 100%; border-radius: 7px; margin-top: 6px; display: block; }
      #send { width: 42px; font-size: 15px; }
      #send:disabled { opacity: .55; cursor: default; }
      #mic.on, #tap.on { background: var(--err); border-color: var(--err); animation: breathe 1.6s infinite; }
      #tts.on, #sound.on, #pilot.on { background: color-mix(in srgb, var(--accent) 18%, var(--field)); border-color: var(--accent); }
      #rec.on { background: var(--err); border-color: var(--err); animation: breathe 1.6s infinite; }
      @keyframes breathe { 50% { opacity: .55; } }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <!-- Inline SVG: hindi umaasa sa icons/ folder, kaya gumagana kahit saan i-install -->
        <svg class="logo" viewBox="0 0 128 128" aria-label="K3">
          <defs>
            <linearGradient id="k3g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c5cff" />
              <stop offset="1" stop-color="#4a2fd0" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#k3g)" />
          <text x="64" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700" fill="#fff">K3</text>
        </svg>
        <span id="statuslight" title="Tumatakbo ang agent"></span>
        <input id="key" type="password" placeholder="Kimi API key (sk-kimi-...)" />
        <select id="model">
          <option value="k3">K3 (1M)</option>
          <option value="k3-256k">K3 (256k)</option>
        </select>
      </div>
      <div class="row">
        <select id="mode">
          <option value="adaptive">Adaptive</option>
          <option value="manual">Manual</option>
          <option value="auto">Auto</option>
          <option value="plan">Plan</option>
          <option value="coach">Coach</option>
          <option value="bypass">Bypass</option>
        </select>
        <span id="hint" class="dim" style="flex:1"></span>
        <button id="mic" title="Voice command — sabihin ang utos, hindi na kailangang mag-type">🎤</button>
        <button id="tap" title="Tunog ng tab → Groq Whisper (lokal na tab, may bayad)">🔊</button>
        <button id="tts" title="Basahin nang malakas ang mga sagot (TTS)">🗣</button>
        <button id="sound" title="Mga tunog kapag tapos na, may tanong, o may error">🔔</button>
        <button id="export" title="I-download ang usapang ito bilang Markdown">⤓</button>
        <button id="mem" title="Ang natutunan niya">🧠</button>
      </div>
    </header>

    <div id="tabs">
      <div id="tabstrip"></div>
      <button id="pilot" title="Autopilot — kusang nagpapatuloy sa susunod na hakbang (max 5 na kadena)">🛩</button>
      <button id="rec" title="Record — i-record ang mga pindot mo sa working tab bilang shortcut">⏺</button>
      <button id="sched" title="Mga naka-iskedyul na gawain">⏰</button>
      <button id="theme" title="Dark / light mode">☾</button>
      <button id="newtab" title="Bagong usapan">✚</button>
    </div>

    <div id="log"></div>

    <footer>
      <div id="thumbs"></div>
      <div class="row">
        <textarea id="ask" placeholder="Ano ang gusto mong gawin? (pwede kang magsalita 🎤 o mag-paste ng larawan)"></textarea>
        <button id="send">↑</button>
      </div>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
