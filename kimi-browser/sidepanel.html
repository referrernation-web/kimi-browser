<!doctype html>
<html lang="tl">
  <head>
    <meta charset="utf-8" />
    <title>Kimi K3</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;        --fg: #1a1a1a;    --dim: #5f6570;
        --panel: #f4f5f7;  --line: #d8dbe0;  --field: #fff;
        --accent: #7c5cff; --userbg: #ede8ff;
        --warn: #b46a00;   --warnbg: #fff4e0; --warnline: #f0c27a;
        --ask: #0b7a5a;    --askbg: #e2f6ef;  --askline: #8fd6bf;
        --err: #c0392b;    --errbg: #fdeceb;
      }
      /* Ang dark mode ay MANUAL na pinipili (☾ sa ⋯ menu) — hindi na sumusunod sa
         system theme. Puti ang default, gusto ng user. */
      body[data-theme='dark'] {
        --bg: #1b1d21;     --fg: #eceef1;    --dim: #a3abb8;
        --panel: #24272c;  --line: #3a3f47;  --field: #2b2f35;
        --accent: #9b85ff; --userbg: #322b52;
        --warn: #f0b657;   --warnbg: #3a2f1c; --warnline: #6b5528;
        --ask: #63d6ae;    --askbg: #1d3830;  --askline: #2f6353;
        --err: #ff8b7d;    --errbg: #3a2320;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg);
        font: 13px/1.55 ui-sans-serif, system-ui, sans-serif;
      }
      header {
        padding: 9px 9px 7px; border-bottom: 1px solid var(--line);
        background: var(--panel); display: grid; gap: 7px;
      }
      .row { display: flex; gap: 6px; align-items: center; }
      input, select, button, textarea {
        font: inherit; padding: 6px 8px; border: 1px solid var(--line);
        border-radius: 7px; background: var(--field); color: var(--fg);
        transition: border-color .15s, background .15s;
      }
      option { background: var(--field); color: var(--fg); }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      input { flex: 1; min-width: 0; }
      button { cursor: pointer; font-weight: 500; }
      button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--field)); }
      button:active { transform: translateY(1px); }
      .dim { color: var(--dim); font-size: 11px; line-height: 1.35; }
      .logo { width: 22px; height: 22px; border-radius: 6px; flex: none; }

      /* Ang kasalukuyang model — laging nakikita para alam mo kung sino ang nagsasalita */
      #modelchip {
        flex: none; font-size: 10.5px; font-weight: 700; color: var(--accent);
        border: 1px solid var(--accent); border-radius: 99px; padding: 2px 9px;
        max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* Violet status light — parang orange ni Claude */
      #statuslight {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: var(--accent); box-shadow: 0 0 7px var(--accent);
        display: none; animation: pulse 1s infinite;
      }
      #statuslight.on { display: block; }

      /* --- SESSION TABS --- */
      #tabs {
        position: relative;
        display: flex; align-items: flex-end; gap: 5px;
        padding: 6px 9px 0; background: var(--panel);
      }
      #tabstrip {
        display: flex; gap: 5px; overflow-x: auto; flex: 1;
        scrollbar-width: thin; padding-bottom: 0;
      }
      #tabstrip::-webkit-scrollbar { height: 4px; }
      .tab {
        display: flex; align-items: center; gap: 5px; flex: none;
        padding: 4px 6px 4px 10px; max-width: 150px;
        border: 1px solid var(--line); border-bottom: none;
        border-radius: 9px 9px 0 0; background: var(--bg);
        font-size: 11.5px; cursor: pointer; opacity: .75; user-select: none;
      }
      .tab.active {
        opacity: 1; font-weight: 600; border-color: var(--accent);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab .dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
        animation: pulse 1.2s infinite; flex: none;
      }
      @keyframes pulse { 50% { opacity: .25; } }
      .tab .unread {
        width: 7px; height: 7px; border-radius: 50%; background: var(--ask); flex: none;
      }
      .tab.dragging { opacity: .35; }
      .tab.dragover { border-left: 3px solid var(--accent); }
      .tab button {
        padding: 0 4px; border: none; background: none; color: var(--dim);
        font-size: 12px; line-height: 1;
      }
      .tab button:hover { color: var(--err); background: none; }
      #tabs > button { flex: none; padding: 4px 7px; margin-bottom: 2px; }
      #menubtn.has-on { border-color: var(--accent); }

      /* --- FEATURE MENU (⋯) — lahat ng toggle at tool, nakatago hanggang kailangan --- */
      #menu {
        position: absolute; top: 100%; right: 6px; z-index: 60;
        display: grid; grid-template-columns: repeat(4, minmax(56px, 1fr)); gap: 4px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
        padding: 9px; box-shadow: 0 8px 28px #0003; margin-top: 2px;
      }
      #menu .mi {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        font-size: 9.5px; color: var(--dim);
      }
      #menu .mi button { width: 38px; height: 32px; padding: 0; font-size: 14px; }
      #menu .mi button.on {
        background: color-mix(in srgb, var(--accent) 18%, var(--field));
        border-color: var(--accent);
      }
      #menu .mi button.hot { background: var(--err); border-color: var(--err); animation: breathe 1.6s infinite; }

      #log { flex: 1; overflow-y: auto; padding: 11px; display: flex; flex-direction: column; gap: 9px; }
      #log > * { animation: rise .18s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

      .msg { padding: 8px 10px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .user { background: var(--userbg); align-self: flex-end; max-width: 88%; }
      .assistant { background: var(--panel); border: 1px solid var(--line); }
      .assistant.live { border-color: var(--accent); }
      .assistant.live::after { content: ' ▍'; color: var(--accent); animation: pulse .8s infinite; }
      .modeltag {
        font-size: 9.5px; font-weight: 700; color: var(--accent);
        opacity: .85; margin-bottom: 3px; letter-spacing: .02em;
      }
      .tool {
        color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px;
        padding: 2px 10px; border-left: 2px solid var(--line);
      }
      .error { color: var(--err); background: var(--errbg); border: 1px solid var(--err); }

      .confirm { border: 1px solid var(--warnline); background: var(--warnbg); padding: 10px; border-radius: 9px; }
      .confirm b { display: block; margin-bottom: 5px; color: var(--warn); }
      .question { border: 1px solid var(--askline); background: var(--askbg); padding: 10px; border-radius: 9px; }
      .question b { display: block; margin-bottom: 7px; color: var(--ask); }
      .opts { display: flex; flex-wrap: wrap; gap: 6px; }

      .tablebox { border: 1px solid var(--line); border-radius: 9px; padding: 9px; background: var(--panel); }
      .tablebox > .row { margin-bottom: 7px; }
      .tablewrap { overflow-x: auto; }
      table { border-collapse: collapse; font-size: 11.5px; width: 100%; }
      th, td { border-bottom: 1px solid var(--line); padding: 4px 7px; text-align: left; white-space: nowrap; }
      th { cursor: pointer; user-select: none; color: var(--dim); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
      th:hover { color: var(--accent); }
      tr:last-child td { border-bottom: none; }
      td a { color: var(--accent); }

      details.think { color: var(--dim); font-size: 12px; border-left: 2px dashed var(--line); padding: 2px 10px; }
      details.think summary { cursor: pointer; user-select: none; }
      details.think.live { border-left-color: var(--accent); }

      footer { padding: 9px; border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 6px; }
      footer .row { align-items: stretch; }
      #ask { flex: 1; resize: none; height: 56px; }
      #thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
      #thumbs:empty { display: none; }
      .thumb { position: relative; }
      .thumb img { height: 52px; border-radius: 6px; border: 1px solid var(--line); display: block; }
      .thumb button {
        position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
        padding: 0; border-radius: 50%; line-height: 1; font-size: 13px;
      }
      .msg img { max-width: 100%; border-radius: 7px; margin-top: 6px; display: block; }
      #send { width: 42px; font-size: 15px; }
      #send:disabled { opacity: .55; cursor: default; }
      #mic.on, #tap.on { background: var(--err); border-color: var(--err); animation: breathe 1.6s infinite; }
      @keyframes breathe { 50% { opacity: .55; } }

      /* --- PLAN CHECKLIST bubble — ang plano ng agent, may umuusad na check marks --- */
      .planbox { border: 1px solid var(--accent); border-radius: 9px; padding: 9px 11px; }
      .planbox b { color: var(--accent); font-size: 11px; letter-spacing: .03em; }
      .planbox ol { list-style: none; margin: 5px 0 0; padding: 0; display: grid; gap: 3px; }
      .planbox li { display: flex; gap: 7px; align-items: baseline; }
      .planbox .st { font: 700 11px/1.4 ui-monospace, monospace; flex: none; width: 14px; }
      .planbox .done { color: var(--ask); }
      .planbox .doing { color: var(--accent); }
      .planbox .todo, .planbox li.gray { color: var(--dim); }
      .planbar { height: 4px; border-radius: 99px; background: var(--line); margin-top: 7px; overflow: hidden; }
      .planbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

      /* --- ONBOARDING card sa unang bukas — 3 hakbang bago umandar --- */
      .setup { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 9px; }
      .setup b { color: var(--accent); }
      .setup .srow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .setup .n {
        width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center;
        background: var(--accent); color: #fff; font: 700 11px/1 ui-monospace, monospace;
      }
      .setup .provchip { border-radius: 99px; padding: 3px 11px; font-size: 11.5px; }
      .setup .provchip.sel { border-color: var(--accent); color: var(--accent); font-weight: 700; }
      .setup input { font-family: ui-monospace, monospace; font-size: 11px; }
      .setup .try { border-color: var(--accent); color: var(--accent); border-radius: 99px; font-size: 11.5px; }

      /* --- USAGE dashboard — malaki, malinaw, tumpak --- */
      .usagebox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel); display: grid; gap: 11px; }
      .usagebox .uhead { display: flex; align-items: baseline; gap: 8px; }
      .usagebox .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .usagebox .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
      .usagebox .stat .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .usagebox .stat .l { font: 600 9px/1.6 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      .usagebox .urow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
      .usagebox .urow .mdl { font-weight: 600; font-size: 12px; display: flex; gap: 6px; align-items: center; min-width: 0; }
      .usagebox .urow .mdl span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .usagebox .role { font: 700 8.5px/1.5 ui-monospace, monospace; letter-spacing: .06em; border-radius: 4px; padding: 0 5px; flex: none; }
      .usagebox .role.w { background: color-mix(in srgb, var(--accent) 15%, var(--bg)); color: var(--accent); }
      .usagebox .role.a { background: color-mix(in srgb, var(--ask) 15%, var(--bg)); color: var(--ask); }
      .usagebox .nums { font: 10.5px/1.5 ui-monospace, monospace; color: var(--dim); font-variant-numeric: tabular-nums; }
      /* Ang boto ng second brain kada model — berde/dilaw/pula sa isang sulyap */
      .usagebox .score { font: 700 10px/1.5 ui-monospace, monospace; border-radius: 4px; padding: 0 5px; flex: none; }
      .usagebox .score.good { background: color-mix(in srgb, var(--ask) 16%, var(--bg)); color: var(--ask); }
      .usagebox .score.mid { background: color-mix(in srgb, var(--warn) 16%, var(--bg)); color: var(--warn); }
      .usagebox .score.bad { background: color-mix(in srgb, var(--err) 16%, var(--bg)); color: var(--err); }
      .usagebox .ubar { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
      .usagebox .ubar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

      /* --- AUDIT / SECOND BRAIN bubble --- */
      .msg.audit { border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
      .msg.audit.live { border-style: solid; }
      .audit-head {
        display: flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 4px;
      }
      .audit-pass {
        margin-top: 7px; font-size: 11.5px; padding: 3px 9px;
        border: 1px solid var(--accent); color: var(--accent); background: none;
        display: inline-block; width: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <!-- Inline SVG: hindi umaasa sa icons/ folder, kaya gumagana kahit saan i-install -->
        <svg class="logo" viewBox="0 0 128 128" aria-label="K3">
          <defs>
            <linearGradient id="k3g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c5cff" />
              <stop offset="1" stop-color="#4a2fd0" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#k3g)" />
          <text x="64" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700" fill="#fff">K3</text>
        </svg>
        <span id="statuslight" title="Tumatakbo ang agent"></span>
        <select id="mode" style="width:auto;flex:none">
          <option value="adaptive">🤝 Adaptive</option>
          <option value="manual">✋ Manual</option>
          <option value="auto">⚡ Auto</option>
          <option value="plan">👀 Plan</option>
          <option value="coach">🎧 Coach</option>
          <option value="bypass">🚀 Bypass</option>
        </select>
        <span id="hint" class="dim" style="flex:1"></span>
        <span id="modelchip" title="Ang kasalukuyang worker model">k3</span>
        <button id="gear" title="Settings: API key, provider, model, auditor">⚙</button>
      </div>
      <div id="settings" style="display:none;gap:7px">
        <div class="row">
          <input id="key" type="password" placeholder="Kimi API key (sk-kimi-...)" />
          <button id="testkey" title="Subukan kung gumagana ang key">I-test</button>
          <select id="provider" title="Provider" style="width:auto;flex:none">
            <option value="kimi">Kimi</option>
            <option value="groq">Groq (mabilis)</option>
            <option value="tokenplan">Alibaba Token Plan</option>
            <option value="dashscope">Alibaba Qwen</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="row">
          <!-- Totoong select, hindi datalist: ang datalist ay nagtatago ng mga opsyon
               kapag may laman na ang field — hindi makita ng user ang ibang model. -->
          <select id="model" title="Model" style="width:170px;flex:none"></select>
          <input id="baseurl" placeholder="https://... (base URL ng custom provider)" style="display:none" />
        </div>
        <div class="row" id="ttsrow">
          <span class="dim" style="flex:none">🗣 Boses:</span>
          <select id="ttsengine" title="TTS engine" style="width:auto;flex:none">
            <option value="cartesia">Cartesia Sonic (natural na Tagalog)</option>
            <option value="browser">Browser (robotic)</option>
          </select>
          <input id="cartesiakey" type="password" placeholder="Cartesia key (sk_car_...)" style="display:none" />
          <select id="cartesiavoice" title="Boses" style="display:none;max-width:140px"></select>
        </div>
        <div class="row" id="auditrow" style="display:none">
          <span class="dim" style="flex:none">🧐 Second brain:</span>
          <select id="auditprovider" title="Provider ng auditor" style="width:auto;flex:none">
            <option value="kimi">Kimi</option>
            <option value="groq">Groq (mabilis)</option>
            <option value="tokenplan">Alibaba Token Plan</option>
            <option value="dashscope">Alibaba Qwen</option>
            <option value="custom">Custom</option>
          </select>
          <!-- Picker na nagdadagdag sa listahan sa ibaba: kaya pa ring mag-voting
               (comma-separated) pero kita mo na LAHAT ng model, hindi na hulaan. -->
          <select id="amodelpick" title="Idagdag ang model sa auditor" style="width:auto;flex:none"></select>
        </div>
        <div class="row" id="auditrow2" style="display:none">
          <input id="auditmodel" placeholder="hal. qwen3.8-max, deepseek-v4-pro" title="Model(s) ng auditor — comma-separated para sa voting" />
          <button id="auditclear" title="Linisin ang listahan">✕</button>
        </div>
      </div>
    </header>

    <div id="tabs">
      <div id="tabstrip"></div>
      <span id="timer" class="dim" style="flex:none;align-self:center;margin-bottom:2px"></span>
      <button id="menubtn" title="Mga feature">⋯</button>
      <button id="newtab" title="Bagong usapan">✚</button>
      <div id="menu" style="display:none">
        <div class="mi"><button id="mic" title="Voice command">🎤</button><span>Voice</span></div>
        <div class="mi"><button id="tts" title="Basahin nang malakas (TTS)">🗣</button><span>TTS</span></div>
        <div class="mi"><button id="sound" title="Mga tunog">🔔</button><span>Sounds</span></div>
        <div class="mi"><button id="tap" title="Tunog ng tab → Whisper">🔊</button><span>Tab audio</span></div>
        <div class="mi"><button id="audit" title="Second brain / voting">🧐</button><span>2nd brain</span></div>
        <div class="mi"><button id="pilot" title="Autopilot">🛩</button><span>Autopilot</span></div>
        <div class="mi"><button id="teach" title="Teaching captions sa page — para matuto ang nanonood">🎓</button><span>Teach</span></div>
        <div class="mi"><button id="rec" title="Record shortcut">⏺</button><span>Record</span></div>
        <div class="mi"><button id="sched" title="Scheduled tasks">⏰</button><span>Schedule</span></div>
        <div class="mi"><button id="stats" title="Usage per model">📊</button><span>Usage</span></div>
        <div class="mi"><button id="mem" title="Ang natutunan niya">🧠</button><span>Memory</span></div>
        <div class="mi"><button id="export" title="I-download bilang Markdown">⤓</button><span>Export</span></div>
        <div class="mi"><button id="theme" title="Dark / light">☾</button><span>Theme</span></div>
      </div>
    </div>

    <div id="log"></div>

    <footer>
      <div id="thumbs"></div>
      <div class="row">
        <textarea id="ask" placeholder="Ano ang gusto mong gawin? (pwede kang magsalita 🎤 o mag-paste ng larawan)"></textarea>
        <button id="send">↑</button>
      </div>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
