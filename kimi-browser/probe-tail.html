<script type="module" src="./sidepanel.js"></script>
<script>
const hintay = (ms) => new Promise((r) => setTimeout(r, ms));
const teksto = (sel) => [...document.querySelectorAll(sel)].map((e) => e.textContent);

setTimeout(async () => {
  const out = { errors: (window.__err || []).slice(0, 3) };

  // ---------- 1. PROJECTS: kusang pagmamarka at ang dalawang buton ----------
  try {
    await document.getElementById('proj').onclick();
    await hintay(400);
    out.buod = document.querySelector('.projrow .n')?.textContent;
    const buksan = [...document.querySelectorAll('.projrow button')].find((b) => b.textContent === '▸');
    await buksan.onclick();
    await hintay(400);
    out.mgaButon = [...document.querySelectorAll('.filerow')]
      .map((r) => [...r.querySelectorAll('button')].map((b) => b.textContent).join('')).join(' | ');
    let rows = [...document.querySelectorAll('.filerow')];
    await rows[0].querySelectorAll('button')[0].onclick();
    await hintay(300);
    rows = [...document.querySelectorAll('.filerow')];
    await rows[1].querySelectorAll('button')[1].onclick();
    await hintay(300);
    out.pangalan = teksto('.filerow .fn').join(' | ');
    out.roleSaStorage = (await chrome.storage.local.get('projects')).projects.p1.files.map((f) => f.role || '-').join(',');
  } catch (e) {
    out.projErr = String(e && e.stack ? e.stack.split('\n').slice(0, 2).join(' ') : e);
  }

  // ---------- 2. DOC CARD: ang checker, ang mga file card, ang preview ----------
  // Ito ang pinakabagong code at ang hindi naaabot ng test-wiring: ang mga buton dito
  // ay ginagawa sa runtime, at ang checker ay tumatakbo sa isang dynamic na import.
  try {
    const { renderLog, ...rest } = {};
    // Buhayin ang doc card sa pamamagitan ng transcript entry, gaya ng totoong daloy.
    const s = (await chrome.storage.local.get('sessions')).sessions?.[0];
    out.docCard = 'sinusubukan';
    const mod = await import('./lint.js');
    const D = await import('./docs.js');
    const html = await D.docAsHtml('sess1');
    const r = mod.lintArticle(html, { words: 1800 });
    out.checker = `${r.filter((x) => x.ok).length}/${r.length}`;
    out.nahuli = r.filter((x) => !x.ok).map((x) => x.label).slice(0, 5);
    out.utos = mod.lintPrompt(r).slice(0, 90);
  } catch (e) {
    out.lintErr = String(e && e.stack ? e.stack.split('\n').slice(0, 2).join(' ') : e);
  }

  // ---------- 3. Ang view.html ay nakakabasa mula sa storage ----------
  try {
    const D = await import('./docs.js');
    const d = await D.docGet('sess1');
    out.view = d ? `${d.title.slice(0, 30)} · ${d.sections.length} seksyon` : 'WALA';
  } catch (e) {
    out.viewErr = String(e);
  }

  document.title = 'RESULT:' + JSON.stringify(out);
}, 1000);
</script>
